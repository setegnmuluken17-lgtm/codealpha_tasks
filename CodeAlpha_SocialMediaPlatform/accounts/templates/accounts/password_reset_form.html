{% extends 'base.html' %}
{% block title %}Password Reset{% endblock %}
{% block content %}
<div class="container">
  <h3>Reset your password</h3>
  <form method="post">{% csrf_token %}
    {{ form.email }}
    <button type="submit" class="btn btn-primary mt-2">Send reset email</button>
  </form>
</div>
{% endblock %}
