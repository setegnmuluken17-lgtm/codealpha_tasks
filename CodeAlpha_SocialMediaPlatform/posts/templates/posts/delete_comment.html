{% extends 'base.html' %}

{% block title %}Delete Comment - SocialHub{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card border-danger">
                <div class="card-body p-5">
                    <h2 class="card-title text-danger mb-4">Delete Comment?</h2>
                    
                    <p class="text-muted mb-4">
                        Are you sure you want to delete this comment? This action cannot be undone.
                    </p>

                    <div class="alert alert-light">
                        <p class="mb-0"><strong>{{ comment.author.username }}</strong></p>
                        <p class="mb-0">{{ comment.content }}</p>
                    </div>

                    <form method="post" class="d-flex gap-2 justify-content-center">
                        {% csrf_token %}
                        <a href="{% url 'post_detail' comment.post.id %}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-danger">Delete Comment</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
